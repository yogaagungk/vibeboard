name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check mcp-server/index.js mcp-server/db.js mcp-server/agent.js mcp-server/worktree.js mcp-server/migrate.js

      - name: Validate package.json
        run: node -e "require('./package.json')"

      - name: Check UI file exists and is valid HTML
        run: |
          test -f public/index.html
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/index.html', 'utf8');
            if (!html.includes('<!DOCTYPE html>')) process.exit(1);
            if (!html.includes('</html>')) process.exit(1);
            console.log('UI file OK (' + html.length + ' bytes)');
          "

      - name: Run tests
        run: node --test test/*.test.js
