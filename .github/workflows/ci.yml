name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server + UI modules
        run: for f in mcp-server/*.js public/js/*.js; do node --check "$f"; done

      - name: Validate package.json
        run: node -e "require('./package.json')"

      - name: Check UI file exists and is valid HTML
        run: |
          test -f public/index.html
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/index.html', 'utf8');
            if (!html.includes('<!DOCTYPE html>')) process.exit(1);
            if (!html.includes('</html>')) process.exit(1);
            console.log('UI file OK (' + html.length + ' bytes)');
          "

      - name: Run tests
        run: npm test

      - name: Smoke test (start server and verify /board endpoint)
        run: |
          timeout 30s node mcp-server/index.js &
          SERVER_PID=$!
          sleep 5
          curl -f http://127.0.0.1:7341/board || (kill $SERVER_PID; exit 1)
          kill $SERVER_PID
          echo "Smoke test passed: server started and /board returned 200"
